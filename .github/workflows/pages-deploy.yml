on:
  # push:
  #   branches:
  #     - 'main'       # 监听 main 分支的推送
  #     - 'master'     # 如果旧项目用 master，也可加上
      
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_pages:
    name: 构建网页
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 安装mkdocs
        run: |
          pip install mkdocs mkdocs-material

      - name: 构建html
        run: mkdocs build

      - name: 上传网页制品
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site   # mkdocs输出到site文件夹，不是docs

  deploy_pages:
    name: 发布网页
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build_pages
    steps:
      - name: 部署到GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
